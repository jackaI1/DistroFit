name: Power BI native checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-model:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned Microsoft Power BI Desktop
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://download.microsoft.com/download/8/8/0/880BCA75-79DD-466A-927D-1ABF1F5454B0/PBIDesktopSetup-2026-10_x64.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'PBIDesktopSetup.exe'
          Invoke-WebRequest $url -OutFile $installer
          $expected = '55E8EE44AA908D75EDAED4BDB1A34863F41C047951F3724F298486FE07049F2D'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Installer hash mismatch' }
          $install = Start-Process $installer -ArgumentList '-quiet','-norestart','ACCEPT_EULA=1' -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "Install failed: $($install.ExitCode)" }
          Remove-Item $installer
      - name: Open the committed report, execute native DAX and capture the pages
        shell: pwsh
        run: ./powerbi/desktop_smoke.ps1
      - name: Open the anomaly report and verify flagged event counts in native DAX
        shell: pwsh
        run: ./powerbi/desktop_smoke.ps1 -Root examples/anomalies/powerbi -Output native-evidence/anomalies -PageNames @('Production anomalies')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powerbi-native-evidence
          path: native-evidence/
