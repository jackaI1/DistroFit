name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Graphviz for process diagrams
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Generate the DMAIC management board
        run: python dmaic.py --input examples/dmaic/production.json --out "$RUNNER_TEMP/dmaic-board.html"
      - name: Generate the 6S audit review, flow chart and SOP
        run: python six_s_report.py --sample --out "$RUNNER_TEMP/distrofit-bench-review"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-bench-audit-and-process
          path: ${{ runner.temp }}/distrofit-bench-review/
          retention-days: 7
      - name: Compare production anomaly detectors on seeded faults
        run: python anomaly_report.py --sample --out "$RUNNER_TEMP/distrofit-anomalies"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-production-anomalies
          path: ${{ runner.temp }}/distrofit-anomalies/
          retention-days: 7
      - name: Run and verify a saved comparison
        run: |
          python compare_distributions.py fit --sample --out "$RUNNER_TEMP/distrofit-comparison"
          python compare_distributions.py verify "$RUNNER_TEMP/distrofit-comparison"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-comparison
          path: ${{ runner.temp }}/distrofit-comparison/
          retention-days: 7
      - name: Replay the synthetic root-cause investigation
        run: python docs/root_cause_investigation.py --out "$RUNNER_TEMP/distrofit-root-cause"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-root-cause-evidence
          path: ${{ runner.temp }}/distrofit-root-cause/
          retention-days: 7
      - name: Analyze censored equipment lifetimes
        run: python reliability_report.py --sample --out "$RUNNER_TEMP/distrofit-reliability"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-reliability-analysis
          path: ${{ runner.temp }}/distrofit-reliability/
          retention-days: 7
      - name: Fit and check a hierarchical Bayesian sample
        run: python bayesian.py --sample --out "$RUNNER_TEMP/distrofit-grouped"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-grouped-bayesian-analysis
          path: ${{ runner.temp }}/distrofit-grouped/
          retention-days: 7
      - name: Plan, simulate and analyse a fractional factorial changeover study
        run: python doe.py --sample --out "$RUNNER_TEMP/distrofit-doe"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-changeover-doe
          path: ${{ runner.temp }}/distrofit-doe/
          retention-days: 7
      - name: Benchmark the bootstrap likelihood backend (CPU only on hosted runners)
        run: python bench_bootstrap.py --sizes 200 1000 --resamples 200 --repeats 1 --out "$RUNNER_TEMP/distrofit-bootstrap-bench"
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-backend-benchmark
          path: ${{ runner.temp }}/distrofit-bootstrap-bench/
          retention-days: 7
      - name: Stream a 2-million-row CSV and fit a 5,000-row random sample
        run: |
          python tools/make_large_csv.py --rows 2000000 --out "$RUNNER_TEMP/large-csv/measurements.csv"
          python compare_distributions.py fit --input "$RUNNER_TEMP/large-csv/measurements.csv" --column Gamma_Measurement --sample-size 5000 --out "$RUNNER_TEMP/distrofit-large-csv"
          python compare_distributions.py verify "$RUNNER_TEMP/distrofit-large-csv"
      - uses: actions/upload-artifact@v4
        with:
          name: streamed-large-csv-fit
          path: ${{ runner.temp }}/distrofit-large-csv/
          retention-days: 7
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-notebook.txt
      - name: Run the failure-mode notebook headlessly
        run: python -m pytest --nbmake notebooks/failure_modes.ipynb -q
  excel-recalculation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/test_excel_report.py tests/test_excel_families.py -q
        env:
          REQUIRE_SPREADSHEET_ENGINE: '1'
      - run: python excel_report.py --sample --out excel-example/distrofit_review.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-excel-review
          path: excel-example/distrofit_review.xlsx
  powerpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python powerpoint_report.py --sample --out /tmp/distrofit-review.pptx
      - run: python tools/powerpoint_fixtures.py /tmp/powerpoint-fixtures
      - run: dotnet run --project tools/ValidatePowerPoint -p:UseSharedCompilation=false -- examples/powerpoint/synthetic-review.pptx /tmp/distrofit-review.pptx /tmp/powerpoint-fixtures/*.pptx
      - run: sudo apt-get update -qq && sudo apt-get install -y libreoffice-impress
      - name: Render with a separate temporary viewer profile
        run: |
          timeout 90s libreoffice -env:UserInstallation=file:///tmp/distrofit-lo --headless --convert-to pdf --outdir /tmp/rendered /tmp/distrofit-review.pptx /tmp/powerpoint-fixtures/*.pptx
          for name in distrofit-review all-candidates empty infinite negative; do test -s "/tmp/rendered/$name.pdf"; done
      - uses: actions/upload-artifact@v4
        with:
          name: powerpoint-example
          path: |
            /tmp/distrofit-review.pptx
            /tmp/rendered/*.pdf
