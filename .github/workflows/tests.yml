name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
  excel-recalculation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/test_excel_report.py -q
        env:
          REQUIRE_SPREADSHEET_ENGINE: '1'
      - run: python excel_report.py --sample --out excel-example/distrofit_review.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-excel-review
          path: excel-example/distrofit_review.xlsx
